name: CI

# Paths and the working directory below are relative to this repository's
# root — i.e. they assume the backend is the repo root. GitHub only discovers
# workflows in `.github/workflows` at the root of a repository, so this file
# runs once `backend/` is itself the repository (or once this folder is
# published as one). It is inert while it sits inside a larger monorepo.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Lets you kick off a run by hand from the Actions tab.
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Typecheck & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install
        run: npm ci

      # `npm run build` is tsc, so this is the typecheck as well.
      - name: Build
        run: npm run build

      - name: Verify the built entrypoint exists
        run: test -f dist/index.js

      # Proves the emitted JavaScript actually runs — tsc alone won't catch a
      # bad ESM specifier or a broken import at runtime. No database needed:
      # a missing DB_URI must make startup exit non-zero rather than hang.
      - name: Startup rejects an incomplete environment
        run: |
          set +e
          timeout 30s node dist/index.js > boot.log 2>&1
          code=$?
          set -e
          cat boot.log
          if [ "$code" -eq 124 ]; then
            echo "::error::Server kept running without DB_URI — env validation did not reject it"
            exit 1
          fi
          if [ "$code" -eq 0 ]; then
            echo "::error::Server exited cleanly without DB_URI — env validation did not reject it"
            exit 1
          fi
          echo "Rejected an incomplete environment as expected (exit $code)"
        env:
          NODE_ENV: test
